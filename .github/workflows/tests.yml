name: tests

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  godot:
    # 통합 씬은 --audio-driver CoreAudio 가 필요하다(tools/run_all_tests.sh 주석) — macOS 러너.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: false

      - name: 생성 도구 Python 환경
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install numpy
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: 생성 자산 (wav 류는 gitignore)
        run: sh tools/gen_all.sh

      # 새 클론은 .godot/ 캐시가 없다. run_all_tests.sh 의 0단계와 같은 import 를
      # 따로 돌려 두고 테스트 단계는 SKIP_IMPORT=1 로 건너뛴다(로그에 import 소음이 안 섞이게).
      - name: 에셋 import
        run: godot --headless --import > import.log 2>&1 || true

      # 판정은 종료 코드로만 한다. Godot 가 통과한 실행에서도 찍는 ERROR·WARNING
      # (종료 시 누수 보고, 일부러 잘못된 입력을 먹이는 테스트)은 요약 단계가 따로 분류한다.
      - name: 전체 테스트
        id: tests
        run: |
          set +e
          SKIP_IMPORT=1 bash tools/run_all_tests.sh 2>&1 | tee test-output.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # 카메라 게이트 자체 검증 — 90ms 멈춤을 일부러 넣어도 '멈춤'으로 분류돼
      # 연속성 게이트에서 빠지는지 본다. 이게 실패하면 게이트가 러너 부하를 잰다는 뜻이다.
      - name: 카메라 검증 (멈춤 주입)
        run: |
          set +e
          godot --headless --audio-driver CoreAudio res://tests/SmokeScene.tscn -- --autoplay --inject-hitch=30 2>&1 | tee camera-hitch.log
          exit "${PIPESTATUS[0]}"

      - name: 결과 요약 (실패 · 예상된 오류 · 경고 구분)
        if: always()
        run: |
          for f in test-output.log camera-hitch.log; do
            [ -f "$f" ] || continue
            echo "# $f" >> "$GITHUB_STEP_SUMMARY"
            code="${{ steps.tests.outputs.code }}"
            if [ "$f" = test-output.log ] && [ -n "$code" ]; then
              python3 tools/summarize_test_log.py "$f" --exit-code "$code" >> "$GITHUB_STEP_SUMMARY"
            else
              python3 tools/summarize_test_log.py "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: 로그 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: |
            test-output.log
            camera-hitch.log
            import.log
